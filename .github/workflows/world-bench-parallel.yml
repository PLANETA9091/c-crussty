# Benchmark 3.0 — real-world no-player load benchmark (owner directive 2026-09-16).
#
# Downloads a REAL server world (MineShield-3), force-loads chunks, runs the
# kernel with the c-crussty module injected and ZERO players for a fixed
# window, then produces a machine-ranked bottleneck report (BOTTLENECKS_3.md,
# flamegraphs, collapsed stacks) that feeds the next Rust-replacement
# research rounds.
#
# DIAGNOSTIC boot: spark + async-profiler instruments are attached. Per
# INJECTS-ONLY rules the numbers are NOT parity evidence — they rank hotspots.
#
# World sizes (verified 2026-09-16): Min 6.68 GB (fits ubuntu-latest after
# toolchain reclaim), Full 43.4 GB (requires a larger / self-hosted runner —
# dispatch with the Full URL and a matching runs-on label).
#
# This workflow builds BOTH Rust artifacts from source:
#   - c-crussty module  -> libcrussty.so      (this repo)
#   - CRUSSTY engine    -> libcrussty_runtime.so (PLANETA9091/CRUSSTY)
# and fetches the closed-source natives from the v0.1.0 release asset
# (graceful hotpatch-only mode when absent — labelled in the report).
# MEGA-ROUND parallel bench (TASK-395, owner directive 2026-09-21):
# per-ref concurrency so up to 10 round agents bench their branches SIMULTANEOUSLY
# (world-bench-3 has a global single-run group and would cancel siblings).
# Absorb-compatible with world-bench-3 (same env/artifacts) + generic
# LEVER_FLAG/LEVER_ARG inputs (freed slots: fluid_dirty_ledger, travel_diet — both pinned '0').
#
# x466-C98 COMPO CANON: input defaults below = BANK-V5 canon vector
# (640/300s/fp4/gc3/ic1/fd1/rt4/bc1/pop150k/seed42/10G/xms4G) + era band
# 6.0-9.5M. Dispatch POST {ref} with lever_flag/lever_arg ONLY => canon
# guaranteed by this file (lesson x466-C73: workflow defaults are a merge
# surface). Compo: cmp466_c98ai = climb carrier cmp456_chunkmono_p31snap
# (leg +22.99 v5, 2/3) + AI-depth N=8 (lever_arg=8, C15 leg Л168).

name: world-bench-round

on:
  workflow_dispatch:
    inputs:
      world_url:
        description: 'World zip URL (default MineShield-3 Min 6.68 GB)'
        required: false
        default: 'https://storage.shield.land/public.php/dav/files/twzsxN3HkBQtyED/Season%203/MineShield-3__Min--Normal.zip'
      radius:
        description: 'Forceload radius in blocks (640 = ~9.2k chunks)'
        required: false
        default: '640'
      seconds:
        description: 'No-player run window in seconds'
        required: false
        default: '300' # x466-C98 bank canon (300s)
      fake_players:
        description: 'BENCH-4 fake players N (0 = bench-3 no-player mode; 4 = owner-scenario fixture)'
        required: false
        default: '4' # x466-C98 bank canon (fp4)
      fluid_guard:
        description: 'GUARD-WAVE wave-1 same-state fluid-push guard (1 = ARMED, TASK-80/S7-128; 0 = pre-guard A/B leg)'
        required: false
        default: '1'
      # paletted_demux input REMOVED (TASK-335): the 25-input GitHub limit
      # (BU-DEFER needs the slot); lever #1 never armed (requires fluid_free=1
      # which itself never armed) — the flag is pinned to '0' below.
      # alloc_diet input REMOVED (TASK-375): lever #2 REFUTED ×2 (JNI-transition
      # economics, GOAL-реестр) — слот отдан GC-TUNE (парадокс-фикс: STW/параллельный
      # GC — единственные поверхности, где −CPU конвертируется в +TPS 1:1 по
      # построению — они внутри тикового wall-clock; ванильная parity тривиальна —
      # JVM-уровень, семантика игры не трогается).
      gc_tune:
        description: 'GC-TUNE TASK-375/376/380 (1 = G1 flags MaxGCPauseMillis=40 + IHOP=35 + 8m + AlwaysPreTouch; 2 = G1 IHOP=35 + 8m + AlwaysPreTouch NO pause-target; 3 = COLLECTOR SWAP ParallelGC; 4 = COLLECTOR SWAP ZGC generational; 0 = vanilla-GC A/B leg)'
        required: false
        default: '3' # x466-C98 bank canon (gc3 = ParallelGC swap)
      inside_cache:
        description: 'INSIDE-CACHE S7-135/TASK-271 ARCH-ATTACK lever #3 (1 = ARMED: inside-blocks/fluid discovery memoization via InsideBlockOps gate for static entities; 0 = vanilla-discovery A/B leg)'
        required: false
        default: '1' # x466-C98 bank canon (ic1)
      flush_diet:
        description: 'FLUSH-DIET S7-137 ARCH-ATTACK lever #4 (1 = ARMED: StepBasedCollector.flushStep zero-waste addAll via FlushOps.fladd — kills new Object[0] garbage per empty effect step; 0 = vanilla-flush A/B leg)'
        required: false
        default: '1' # x466-C98 bank canon (fd1)
      fluid_dirty:
        description: 'FLUID-DIRTY S7-151/TASK-290 ARCH-ATTACK lever #6 (1 = ARMED: fluid-scan memoization via FluidPushOps.scan + event-driven dirty-stamp ledger on LevelChunk.setBlockState; composes through inside_cache chain; 0 = vanilla-scan A/B leg)'
        required: false
        default: '0'
      lever_flag:
        description: 'MEGA-ROUND generic lever id (empty = vanilla path). Exported as CRUSSTY_LEVER_FLAG, read by branch bridge/loader (e.g. items_sweep, items_index). TASK-395'
        required: false
        default: ''
      lever_arg:
        description: 'MEGA-ROUND generic lever argument, free-form string, exported as CRUSSTY_LEVER_ARG'
        required: false
        default: ''
      fluid_bitmask:
        description: 'FLUIDPUSH-BITMASK RECON-43 ARCH-LEVER #16 / TASK-389 (1 = ARMED: section-resident fluid bitmaps long[128] + median-exact pre-gate in FluidPushGuardHook — replaces the 14.6%-java fluid-scan data plane; invalidation = FluidPushOps.LEDGER stamps + section identity; 0 = banked-guard-only A/B leg)'
        required: false
        default: '0'
      region_threads:
        description: 'REGION-THREADS S7-156/TASK-295 ARCH-ATTACK lever #7 (integer >= 2 = ARMED: region-threaded entity ticking via RegionTickOps — W spatial buckets, W-1 TickThread helpers + main, deferred EntityCallbacks FIFO; 1/0 = vanilla passthrough leg)'
        required: false
        default: '4' # x466-C98 bank canon (rt4)
      batch_collector:
        description: 'BATCH-COLLECTOR S7-160 ARCH-ATTACK lever #8 (1 = ARMED: zero-map flat StepBasedCollector replacement via BatchCollector.ensure lazy swap in RegionTickOps.tickBucket — requires region_threads>=2; 0 = vanilla collector A/B leg)'
        required: false
        default: '1' # x466-C98 bank canon (bc1)
      # flat_traversal input REMOVED (TASK-342): the 25-input GitHub limit;
      # lever #9 was REFUTED (FAIL PG4a) long ago and rolled back — the flag
      # is pinned to '0' below; bridge classes remain infrastructure.
      # travel_diet input REMOVED (TASK-395): slot given to lever_flag (lever #14 dormant-0, pinned below)
      # zero_alloc input REMOVED (TASK-360): the 25-input GitHub limit;
      # lever #10 REFUTED (s7177: TPS -12.5% counter-effect) and rolled back
      # long ago — the flag is pinned to '0' below; ZeroAllocOps bridges
      # remain verified infrastructure.
      inside_bitmask:
        description: 'INSIDE-BITMASK RECON-33 ARCH-ATTACK lever #15 (1 = ARMED: section all-air pre-gate for Entity.checkInsideBlocks via InsideBitmaskOps sweptHullInto + hasOnlyAir sections — median-exact short-circuit before ANY observable action; requires region_threads>=2; 0 = vanilla discovery A/B leg). OPTION-B FLAGMAN: activate only on owner sanction (protocol min-MSPT)'
        required: false
        default: '0'
      # zero_cursor input REMOVED (TASK-332): the 25-input GitHub limit; lever
      # #11 v1 was REFUTED (s7173 harm -22% TPS) and rolled back — the flag is
      # pinned to '0' below; bridge classes remain infrastructure.
      skip_store_bb:
        description: 'SKIP-STORE-BB #13-SBB S7-166 ARCH-ATTACK (1 = ARMED: value-equal store-skip for Entity.setBoundingBox via the SkipStoreOps body-redirect, entity_compose stage-8 — requires region_threads>=2; 0 = vanilla A/B leg)'
        required: false
        default: '0'
      # inside_diet input REMOVED (TASK-333): the 25-input GitHub limit;
      # lever #12 v1 was REFUTED-by-TPS (s7174/75 min-of-2 1.50<1.60) and
      # rolled back — bridges remain verified infrastructure.
      region_steal:
        description: 'STEAL lever #13 v1 (TASK-333): shared snapshot + chunk cursor (512) instead of static region buckets; DONE-park 13.4% -> ~0; requires region_threads>=2; 0 = static-bucket A/B leg'
        required: false
        default: '0'
      bu_defer:
        description: 'S7-168 STEAL v2 defect-fix (TASK-335): 1 = BlockUpdateOps sendBlockUpdated canalization (workers defer navigate-pass to main phase-4 FIFO replay) — kills the s7176 navigatingMobs race NPE; requires region_steal=1'
        required: false
        default: '0'
      population_target:
        description: 'BENCH-X150K living-scene population injection (0 = off; 10000 = smoke; 150000 = prime scale, S7-129)'
        required: false
        default: '150000' # x466-C98 bank canon (pop150k)
      population_seed:
        description: 'Deterministic injection replay seed (BenchPopulationPlugin)'
        required: false
        default: '42'
      server_xmx:
        description: 'Server JVM max heap (S7-130; 6G = historical default, 150k-scale prime runs use 10G)'
        required: false
        default: '10G' # x466-C98 bank canon (10G)
      server_xms:
        description: 'Server JVM initial heap (TASK-321 FREE-HOST track; MUST be <= server_xmx; default 4G preserves all historical legs bit-exact)'
        required: false
        default: '4G'
      cpu_band_min:
        description: 'Pair-hunter fast-fail: min runner_cpu_index band (empty = no gate; S7-96d law pairing infra)'
        required: false
        default: '6000000' # x466-C98 era canon band 6.0-9.5M
      cpu_band_max:
        description: 'Pair-hunter fast-fail: max runner_cpu_index band (empty = no gate)'
        required: false
        default: '9500000' # x466-C98 era canon band 6.0-9.5M
      natives_url:
        description: 'Closed-source natives tar.gz (empty = hotpatch-only mode)'
        required: false
        default: 'https://github.com/PLANETA9091/c-crussty/releases/download/v0.1.0/crussty-v0.1.0-linux-x64.tar.gz'

permissions:
  contents: read

concurrency:
  group: world-bench-round-${{ github.ref }}
  cancel-in-progress: true

jobs:
  world-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout c-crussty (module)
        uses: actions/checkout@v4

      - name: Runner calibration band gate (pair-hunter fast-fail, S7-96d pairing law)
        if: inputs.cpu_band_min != '' && inputs.cpu_band_max != ''
        run: |
          set -euo pipefail
          IDX=$(python3 -c '
          import time
          t=time.time(); x=1
          for _ in range(6000000):
              x=(x*1103515245+12345)&0x7fffffff
          print(f"{6000000/(time.time()-t):.0f}")')
          echo "runner_cpu_index=$IDX band=[${{ inputs.cpu_band_min }},${{ inputs.cpu_band_max }}]"
          if [ "$IDX" -lt "${{ inputs.cpu_band_min }}" ] || [ "$IDX" -gt "${{ inputs.cpu_band_max }}" ]; then
            echo "::notice::runner_cpu_index=$IDX OUTSIDE band — fast-fail pre-download (pairing discard, not a bench failure)"
            exit 1
          fi

      - name: Checkout CRUSSTY (engine runtime)
        uses: actions/checkout@v4
        with:
          repository: PLANETA9091/CRUSSTY
          path: CRUSSTY

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build engine runtime + module (Rust only)
        run: |
          set -euo pipefail
          (cd CRUSSTY/runtime && cargo build --release)
          cargo build --release
          cp CRUSSTY/runtime/target/release/libcrussty_runtime.so "$RUNNER_TEMP/"
          cp target/release/libcrussty.so "$RUNNER_TEMP/"
          touch "$RUNNER_TEMP/.built"

      - name: Run Benchmark 3.0 (world + forceload + no players + profile)
        env:
          WORLD_URL: ${{ inputs.world_url || 'https://storage.shield.land/public.php/dav/files/twzsxN3HkBQtyED/Season%203/MineShield-3__Min--Normal.zip' }}
          FORCELOAD_RADIUS: ${{ inputs.radius || '640' }}
          RUN_SECONDS: ${{ inputs.seconds || '900' }}
          SUMMON_SWEEPS: '0' # legacy (pre-150k era), always 0 since S7-129; input dropped TASK-327 (25-input limit)
          FAKE_PLAYERS: ${{ inputs.fake_players || '0' }}
          FLUID_GUARD: ${{ inputs.fluid_guard || '1' }}
          PALETTED_DEMUX: '0' # input dropped TASK-335 (25-input limit; lever dormant)
          GC_TUNE: ${{ inputs.gc_tune || '0' }}
          INSIDE_CACHE: ${{ inputs.inside_cache || '0' }}
          FLUSH_DIET: ${{ inputs.flush_diet || '0' }}
          FLUID_FREE: '0' # input dropped TASK-330 (requires paletted_demux=1; lever dormant)
          FLUID_DIRTY: ${{ inputs.fluid_dirty || '0' }}
          FLUID_DIRTY_LEDGER: '0' # input dropped TASK-395 (25-input limit; ledger-only mode #16 REFUTED)
          FLUID_BITMASK: ${{ inputs.fluid_bitmask || '0' }}
          REGION_THREADS: ${{ inputs.region_threads || '0' }}
          BATCH_COLLECTOR: ${{ inputs.batch_collector || '0' }}
          FLAT_TRAVERSAL: '0' # input dropped TASK-342 (25-input limit; lever #9 REFUTED FAIL PG4a)
          TRAVEL_DIET: '0' # input dropped TASK-395 (lever #14 dormant-0)
          ZERO_ALLOC: '0' # input dropped TASK-360 (25-input limit; lever #10 REFUTED s7177)
          INSIDE_BITMASK: ${{ inputs.inside_bitmask || '0' }}
          ZERO_CURSOR: '0'
          SKIP_STORE_BB: ${{ inputs.skip_store_bb || '0' }}
          REGION_STEAL: ${{ inputs.region_steal || '0' }}
          BU_DEFER: ${{ inputs.bu_defer || '0' }}
          POPULATION_TARGET: ${{ inputs.population_target || '0' }}
          POPULATION_SEED: ${{ inputs.population_seed || '42' }}
          SERVER_XMX: ${{ inputs.server_xmx || '6G' }}
          SERVER_XMS: ${{ inputs.server_xms || '4G' }}
          NATIVES_TGZ: ${{ inputs.natives_url || 'https://github.com/PLANETA9091/c-crussty/releases/download/v0.1.0/crussty-v0.1.0-linux-x64.tar.gz' }}
          LEVER_FLAG: ${{ inputs.lever_flag || '' }}
          LEVER_ARG: ${{ inputs.lever_arg || '' }}
          RUNTIME_SO: ${{ runner.temp }}/libcrussty_runtime.so
        run: |
          set -euo pipefail
          mkdir -p world3-run/server/modules/crussty
          cp "$RUNNER_TEMP/libcrussty.so" world3-run/server/modules/crussty/
          cp "$RUNNER_TEMP/.built" world3-run/server/modules/crussty/
          bash bench/world3/run_world3.sh

      - name: Entity/state recon (task161/task164 ladder step 1 — javap FROM the booted patched jar)
        run: |
          set -euo pipefail
          # paperclip applies patches at boot into cache/versions — the TRUE
          # kernel classes live there, NOT in the paperclip jar (run#11
          # root-cause: standalone recon job unzip'd the paperclip, matched
          # nothing, shipped a header-only artifact).
          # run#12 root-cause (recon bug #2): find picked cache/mojang_1.21.10.jar
          # (VANILLA bundler, cache sorts before versions) — the patched kernel
          # is versions/<v>/purpur-<v>.jar. Fix: content-test every >20M jar
          # for net/minecraft/server/level/ServerLevel.class (definitive).
          # run#13: + RNG contract classes (task165 BATCH-RNG: advanceSeed
          # LCG semantics + LevelChunkSection.randomTick pick loop).
          PATCHED_JAR=""
          for cand in $(find world3-run/server/cache world3-run/server/versions -name '*.jar' -size +20M 2>/dev/null); do
            if unzip -l "$cand" 2>/dev/null | grep -q 'net/minecraft/server/level/ServerLevel.class'; then
              PATCHED_JAR="$cand"; break
            fi
          done
          if [ -z "$PATCHED_JAR" ]; then
            echo "::warning::no patched kernel jar found — recon skipped"; mkdir -p world3-run; echo "no patched jar found" > world3-run/entity-recon.txt
          else
            echo "patched kernel: $PATCHED_JAR"
            mkdir -p recon/classes
            unzip -q -o "$PATCHED_JAR" \
              'net/minecraft/world/entity/Entity*.class' \
              'net/minecraft/world/entity/vehicle/*.class' \
              'net/minecraft/server/level/ServerLevel*.class' \
              'ca/spottedleaf/moonrise/patches/chunk_system/level/entity/*.class' \
              'ca/spottedleaf/moonrise/common/util/*.class' \
              'ca/spottedleaf/moonrise/patches/chunk_system/level/ServerLevel*.class' \
              'net/minecraft/world/level/levelgen/RandomSource*.class' \
              'net/minecraft/world/level/levelgen/BitRandomSource*.class' \
              'net/minecraft/world/level/levelgen/LegacyRandomSource*.class' \
              'net/minecraft/world/level/levelgen/WorldgenRandom*.class' \
              'net/minecraft/world/level/levelgen/ThreadSafeLegacyRandomSource*.class' \
              'net/minecraft/world/level/levelgen/XoroshiroRandomSource*.class' \
              'net/minecraft/world/level/levelgen/RandomSupport*.class' \
              'net/minecraft/world/level/chunk/LevelChunkSection*.class' \
              'net/minecraft/world/level/chunk/LevelChunk.class' \
              -d recon/classes || true
            JAVAP_BIN="$(command -v javap || true)"
            [ -z "$JAVAP_BIN" ] && [ -n "${JAVA_HOME:-}" ] && JAVAP_BIN="$JAVA_HOME/bin/javap"
            CLASSES=$(find recon/classes -name '*.class' | sed 's|recon/classes/||; s|\.class$||; s|/|.|g' | sort)
            echo "classes: $(echo "$CLASSES" | wc -l)"
            { echo "# entity-recon (booted patched kernel) — $(date -u +%FT%TZ)";
              echo "kernel jar: $PATCHED_JAR";
              for c in $CLASSES; do
                echo; echo "==== $c ====";
                "$JAVAP_BIN" -p -c -classpath recon/classes "$c" 2>/dev/null || echo "(javap failed for $c)";
              done; } > world3-run/entity-recon.txt
            wc -l world3-run/entity-recon.txt
            cp "$PATCHED_JAR" world3-run/patched-kernel.jar
          fi

      - name: Bottleneck report gate
        run: |
          test -s world3-run/BOTTLENECKS_3.md \
            || { echo "::error::BOTTLENECKS_3.md missing — report generation failed"; exit 1; }
          cat world3-run/BOTTLENECKS_3.md
          # BENCH-4 fixture gate (task170): a fake-players run must declare
          # itself VALID, else the owner-scenario evidence is unusable.
          if [ "${{ inputs.fake_players || '0' }}" != "0" ]; then
            grep -q "FIXTURE-VALIDITY: VALID" world3-run/BOTTLENECKS_3.md \
              || { echo "::error::BENCH-4 FIXTURE-VALIDITY: INVALID (spawnable chunks / churn / alive-check failed)"; exit 1; }
          fi
          # BENCH-X150K population gate (S7-129): a population run must
          # complete the injection with the fixture declaring itself VALID
          # (>= 90% of target), else the living-scene evidence is unusable.
          if [ "${{ inputs.population_target || '0' }}" != "0" ]; then
            grep -q "POPULATION INJECT DONE" world3-run/server-stdout.log \
              || { echo "::error::X150K POPULATION INJECT DONE marker missing — injection never completed"; exit 1; }
            grep -q "POPULATION FIXTURE-VALIDITY: VALID" world3-run/server-stdout.log \
              || { echo "::error::X150K POPULATION FIXTURE-VALIDITY: INVALID (injected < 90% of target)"; exit 1; }
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world3-bench
          path: |
            world3-run/BOTTLENECKS_3.md
            world3-run/cpu-collapsed.txt
            world3-run/wall-collapsed.txt
            world3-run/alloc-collapsed.txt
            world3-run/cpu-flamegraph.html
            world3-run/server-stdout.log
            world3-run/gc.log
            world3-run/remset.log
            world3-run/refine.log
            world3-run/recon.jfr
            world3-run/ap.log
            world3-run/run-env.txt
            world3-run/pclip-materialize.log
            world3-run/chunk-parse-diag.txt
            world3-run/entity-recon.txt
            world3-run/patched-kernel.jar
            world3-run/slice_census_pre.txt
            world3-run/slice_census_post.txt
            world3-run/spark-report/
