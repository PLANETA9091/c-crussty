# c-crussty CI — Rust module + recovered native workspace + NCF Phase 0.
#
# Three surfaces are exercised:
#   - module / native / fuzz-crate: the pre-NCF Rust surface (cargo only).
#   - chunk-factory: the NCF standalone crate (deliberately workspace-excluded,
#     sealed .so boundary) — build + unit tests on its own.
#   - golden-harness: the NCF Phase 0 gate on a REAL Purpur 1.21.10 server
#     (owner directive 2026-10-05: "test on GH CI" — the sandbox rig dies on
#     reset, so the Phase 0 order-test control must be replayable on a fresh
#     runner). bench/golden/ci_gate.sh:
#       * builds GoldenDumper.jar from source (guards the mojang-mapped
#         compile surface against drift);
#       * boots TWO FRESH pure-vanilla servers on the canon seed 3053459,
#         dumps the 16x16 region in the canonical spiral order and requires
#         ncfdiff equality on all 256 pairs (replays the control row of
#         bench/golden/results/ORDER_TEST_2026-10-05.md);
#       * then one FRESH spiral boot per GATE_SEEDS seed = P0.4 vanilla
#         corpora, uploaded as artifacts.
#     Purity law holds by construction: dump_corpus.sh is the only boot path —
#     plain Purpur (build pinned via PURPUR_BUILD), NO CRUSSTY agent, no JVM
#     flags beyond heap.

name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check
      # Single-threaded on purpose: unit tests exercise the global SVER
      # seqlock plane (low-level writer helpers bump the GLOBAL shard
      # counters even for local Soa fixtures — production callers hold the
      # WLOCK, tests call them directly), so parallel test threads can tear
      # the sharded reader's brackets -> bounded fail-open ERR_RANGE on
      # loaded 2-vCPU runners.
      - run: cargo test -- --test-threads=1

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: native workspace (recovered P500 sources)
        run: |
          cargo check --workspace
          cargo test --workspace
        working-directory: native

  fuzz-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check
        working-directory: area-map-fuzz

  chunk-factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chunk-factory
      - name: chunk-factory crate (NCF Phase 0 gate/coverage/ledger)
        working-directory: chunk-factory
        run: |
          cargo build
          cargo test

  golden-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PURPUR_BUILD: '2535'
      GATE_SEEDS: '90210 424242 8675309 133700'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: ncfdiff selftest (stdlib only, no server)
        run: python3 bench/golden/tools/ncfdiff.py --selftest
      - name: Phase 0 golden gate (2 fresh spiral boots, zero-diff) + P0.4 seed corpora
        run: bash bench/golden/ci_gate.sh
      - name: upload logs + reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-gate-logs
          path: |
            bench/golden/results/
            ci-server/logs/
            ci-server/patchonly.log
          if-no-files-found: warn
          retention-days: 14
      - name: upload golden dump corpora (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-dump-corpora
          path: ci-server/golden/
          if-no-files-found: warn
          retention-days: 30

  # NCF P0.3-tail / P1: golden-vector gate. Captures random/noise/density
  # vectors from the REAL Paper classes (/goldenvec) and requires the Rust
  # ports to match BIT-EXACTLY (veccheck), plus the Phase 1 IR gate over the
  # vanilla datapack (ircheck). 13171 vector rows, zero mismatches allowed.
  ncf-vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PURPUR_BUILD: '2535'
      SEED: '3053459'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chunk-factory
      - name: vectors + IR gate (boot -> goldenvec -> ircheck + veccheck)
        run: bash bench/golden/ci_vectors.sh
      - name: upload vector gate artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-vector-gate
          path: |
            bench/golden/results/veccheck_*.log
            bench/golden/results/ircheck_*.log
            bench/golden/results/golden_vec_boot.log
          if-no-files-found: warn
          retention-days: 30
      - name: upload captured vectors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-vectors
          path: ci-server/golden/ci_vec/vectors/
          if-no-files-found: warn
          retention-days: 30

  # NCF P3.1 gate: the server READS a .mca region file written by the RUST
  # region writer. Two boots: (1) pure-vanilla raw dump (uncompressed chunk
  # NBT + deterministic non-random-tick probes), (2) fresh world holding ONLY
  # the Rust-forged region file -> forceload -> /execute if block probes.
  # PASS <=> 18/18 block probes match the real generator's output.
  ncf-mca:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PURPUR_BUILD: '2535'
      SEED: '3053459'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chunk-factory
      - name: forge .mca from raw chunk NBT (Rust) + mount + probe on a live server
        run: bash bench/golden/ci_mca.sh
      - name: upload P3.1 gate artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mca-gate-logs
          path: |
            bench/golden/results/mca_*.log
            bench/golden/results/mca_probe_*.txt
            bench/golden/results/mcaforge_*.log
          if-no-files-found: warn
          retention-days: 30

  # NCF P0.4 tail: worldgen-datapack corpora (Terralith + Tectonic) for the
  # Phase 2 GATE matrix, plus the IR gate over non-vanilla datapack routers.
  ncf-datapacks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PURPUR_BUILD: '2535'
      SEED: '3053459'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chunk-factory
      - name: datapack corpora (terralith + tectonic, spiral, fresh boots)
        run: bash bench/golden/ci_datapacks.sh
      - name: upload datapack corpora (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-datapack-corpora
          path: |
            ci-server/golden/terralith_s*/
            ci-server/golden/tectonic_s*/
            ci-datapacks/*.zip
          if-no-files-found: warn
          retention-days: 30
