# c-crussty CI — Rust module + recovered native workspace.
#
# The Java bridge material is exercised through cargo tests (byte-parity
# between the embedded payloads and bridges/*/build), so a Rust job covers the
# load-bearing surface. area-map-fuzz is a standalone workspace member
# (excluded from the root workspace) and gets its own check.

name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check
      # Single-threaded on purpose: unit tests exercise the global SVER
      # seqlock plane (low-level writer helpers bump the GLOBAL shard
      # counters even for local Soa fixtures — production callers hold the
      # WLOCK, tests call them directly), so parallel test threads can tear
      # the sharded reader's brackets -> bounded fail-open ERR_RANGE on
      # loaded 2-vCPU runners.
      - run: cargo test -- --test-threads=1

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: native workspace (recovered P500 sources)
        run: |
          cargo check --workspace
          cargo test --workspace
        working-directory: native

  fuzz-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check
        working-directory: area-map-fuzz
