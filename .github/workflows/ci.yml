# c-crussty CI — Rust cdylib build + Java bridge compilation + P500 smoke
# + canary gate [-6,+6] (ROUND-471-S67 DRAFT — draft-diff, not merged).
# + merge shadow gate (S75 f437b9fb: fail-open 4-cell ledger —
#   SH-BLOB/SH-JAVAP/SH-NCDFE/SH-PARITY-TAG; exit ALWAYS 0, drift/
#   mismatch only as ::notice + merge-shadow-verdict.json artifact).
#
# Permissions are minimal (contents: read + actions: read for the canary-guard
# job, which downloads the world3-bench artifact of the triggering bench run).
# No secrets are used anywhere: checkout uses the default read-only GITHUB_TOKEN.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # canary-guard: fire after every completed world-bench-round bench run
  # (the dispatch-canon workflow) and gate its norm_v5 against [-6,+6].
  workflow_run:
    workflows: [world-bench-round]
    types: [completed]

permissions:
  contents: read
  actions: read # canary-guard: fetch artifacts of the triggering run

jobs:
  rust:
    # S24: the 5 build/smoke jobs keep push/PR-only semantics — workflow_run
    # events (world-bench-round completion) are owned by canary-guard alone.
    if: github.event_name != 'workflow_run'
    name: rust build (libcrussty.so)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Registry + target cache, keyed on Cargo.lock / workspace layout.
      - uses: Swatinem/rust-cache@v2

      # Root package "crussty" (crate-type cdylib) + its path deps
      # cplug-abi / cplug-sdk build together. Output:
      #   target/release/libcrussty.so
      - run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: libcrussty-linux-x64
          path: target/release/libcrussty.so
          if-no-files-found: error

  java:
    # S24: the 5 build/smoke jobs keep push/PR-only semantics — workflow_run
    # events (world-bench-round completion) are owned by canary-guard alone.
    if: github.event_name != 'workflow_run'
    name: java bridge classes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # noise/ bridge (ImprovedNoiseNativeOps + Handle) is compiled BY THE
      # REPO'S OWN SCRIPT — CI does not pass javac flags itself, so it follows
      # whatever --release the script pins at the checked-out commit.
      #   * committed script pins --release 8 (major 52); a pending handle-
      #     lifecycle refactor (java.lang.ref.Cleaner, Java 9+ API) may move
      #     it to --release 11 (major 55) — both stay <= major 65 (kernel JVM
      #     = Java 21) and the script itself hard-fails above 65.
      #   * javac 21 supports --release 8..21, so both pins are buildable on
      #     the temurin 21 toolchain installed here.
      - name: build noise bridge (scripts/build_noise.sh)
        run: bash scripts/build_noise.sh

      # area-map/ bridge (SingleUserAreaMapOps -> include_bytes!'d as
      # src/area_map_ops.class) has no build script in the repo, so CI compiles
      # it directly into area-map/build.
      # --release 8 (major 52) is the repo-documented pin — see the javadoc in
      # SingleUserAreaMapOps.java: the class is define_class'd into the kernel
      # JVM from the bootstrap loader, and the committed artifact is major 52.
      # (The "--release 11" flag from the task applies to the noise bridge's
      # Cleaner-based refactor; area-map keeps the stricter --release 8 pin.)
      - name: compile area-map bridge sources
        run: |
          mkdir -p area-map/build
          javac --release 8 -Xlint:-options \
            -d area-map/build \
            area-map/ca/spottedleaf/moonrise/common/misc/RuntimeStubs.java \
            area-map/ca/spottedleaf/moonrise/common/misc/SingleUserAreaMapOps.java

      - uses: actions/upload-artifact@v4
        with:
          name: java-bridge-classes
          path: |
            noise/build/
            area-map/build/
          if-no-files-found: error

  # Informational P500 smoke: the closed-source kernel .so files ARE committed
  # under native/, so System.load()/dlopen works on the Linux runner — but the
  # kernels may still abort() on synthetic shapes (the retry ladder documented
  # in bench/p500/run_p500.sh exists for exactly that) or need a newer glibc
  # than ubuntu-latest ships. Therefore: 60s cap, any exit code tolerated,
  # continue-on-error — this job reports, it never blocks CI.
  smoke:
    # S24: the 5 build/smoke jobs keep push/PR-only semantics — workflow_run
    # events (world-bench-round completion) are owned by canary-guard alone.
    if: github.event_name != 'workflow_run'
    name: smoke (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # gen_p500_bench.py has NO group-filter CLI — it (re)generates the whole
      # set (49 groups + stubs + Bench.java) from native/JNI_EXPORTS.manifest.
      # Running it here validates the generator against the manifest; the
      # output overwrites the identical committed sources on the runner only.
      - name: generate P500 bench sources
        run: python3 bench/p500/gen_p500_bench.py

      # Compile ONE group: gid 0 (PaperNativeAquiferIndexStride (I[J)I); a gid
      # N is line N+1 of bench/p500/java/p500/groups.tsv. Minimal compile set:
      # Group interface + Bench driver + the group class + the group's fqcn
      # stub class (group and stub classes live in the default package — see
      # Class.forName("G<gid>") in Bench.java).
      - name: compile one P500 group (gid 0) + driver
        run: |
          cd bench/p500
          mkdir -p classes
          javac -d classes \
            java/p500/Group.java \
            java/p500/Bench.java \
            java/p500/G0.java \
            java/PaperNativeAquiferIndexStride.java

      # Hard 60s cap; JVM flags mirror bench/p500/run_p500.sh. Non-zero exit
      # (timeout 124, UnsatisfiedLinkError, kernel abort) is tolerated and
      # only surfaces as a workflow notice.
      - name: run group 0 against committed natives
        run: |
          cd bench/p500
          LIBS="$GITHUB_WORKSPACE/native/libpaper_native_jni.so:$GITHUB_WORKSPACE/native/libpaper_native_chunk_encode_jni.so"
          timeout 60 java -Xms256m -Xmx1g -XX:+UseG1GC \
            -Dp500.libs="$LIBS" -cp classes p500.Bench 0 \
            || echo "::notice::smoke exit $? — informational only (kernel libs may fail to load or abort on synthetic shapes)"

  # Area-map headless smokes (informational, continue-on-error: closed native
  # may fail on runner glibc; fake/stub modes carry the regression signal).
  #   bench/areamap (TASK-11, agent-7625532f): Ops.run() parity grid vs naive
  #     difference, MIN_VALUE guard, fake + real .so modes.
  #   tests/area_map_smoke (dup delivery): the ACTUAL patched update() bytes —
  #     patch_tool.py byte-mirror of classfile.rs::patch_update, full JVM
  #     verification, same-state fast path + Scratch init + naive parity.
  areamap-smoke:
    # S24: the 5 build/smoke jobs keep push/PR-only semantics — workflow_run
    # events (world-bench-round completion) are owned by canary-guard alone.
    if: github.event_name != 'workflow_run'
    name: area-map smokes (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: bench/areamap smoke (parity grid, fake + real .so)
        run: bash bench/areamap/run_smoke.sh "$(dirname "$(command -v javac)")"
      - name: tests/area_map_smoke (patched-bytes suite)
        run: bash tests/area_map_smoke/run.sh

  # TASK-36 / TASK-15: area-map-fuzz differential parity (crate b6bb359).
  # area-map-fuzz/ is workspace-EXCLUDED on purpose (standalone, zero deps),
  # so cargo must run INSIDE that directory — a root-level `cargo test
  # --workspace` never sees it. All 3 suites (~13.9k cases: 10k+ randomized
  # parity, adversarial same-state idempotency, edge-coordinate sweep) derive
  # from the fixed BASE_SEED: fully deterministic and headless (no JVM, no
  # JNI, no .so). continue-on-error is deliberately FALSE — unlike the
  # informational smokes above, a failure here is a REAL parity bug in the
  # shipped fast-path model and must fail CI loudly.
  areamap-fuzz:
    # S24: the 5 build/smoke jobs keep push/PR-only semantics — workflow_run
    # events (world-bench-round completion) are owned by canary-guard alone.
    if: github.event_name != 'workflow_run'
    name: area-map-fuzz differential parity (seeded, loud)
    runs-on: ubuntu-latest
    continue-on-error: false
    # ~15s test in --release on runners (crate README), cold build is seconds
    # (zero dependencies); budget covers a cold toolchain + uncached build.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Same toolchain setup as the `rust` job above.
      - uses: dtolnay/rust-toolchain@stable

      # Cache scoped to the standalone fuzz workspace (own Cargo.lock, own
      # target/ inside area-map-fuzz/) — the default workspace cache here
      # would not cover it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: area-map-fuzz

      # tee + pipefail: the job still fails on a bad exit code, but the full
      # test output is preserved for the failure-only artifact upload below.
      - name: cargo test --release (inside workspace-excluded crate)
        working-directory: area-map-fuzz
        run: |
          set -o pipefail
          cargo test --release 2>&1 | tee fuzz-test.log

      - name: Upload fuzz test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: areamap-fuzz-test-log
          path: area-map-fuzz/fuzz-test.log
          retention-days: 14
          if-no-files-found: ignore
  # CANARY-GUARD [-6,+6] (ROUND-471-S67 draft; S40/S43 lane).
  #
  # After each world-bench-round run completes: download its world3-bench
  # artifact, parse norm_v5 from the bench summary
  #   norm_v5 = 100*(tail-median(TPS)/tps_exp - 1)
  #   tail    = sub-15 TPS polls of server-stdout.log (warm-up 20.x dropped)
  #   tps_exp = bank v5 piecewise-linear interp (BANK below) with the L201
  #             local node 2.1293 for runner_cpu_index in [6.9,7.2]M (L213:
  #             the gate MUST carry the local node, +-3.2-3.7pp error budget),
  # and FAIL THIS JOB when |norm| breaches the [-6,+6] gate.
  #
  # Breach semantics: a red gate is a RE-ROLL / MAIN-ARBITRATION signal, NOT a
  # revert. CI never reverts master — revert authority = MAIN + min-of-8 base
  # (L182 canon). Single-run false-gate rate at bank MAE 5.91 = 41.8%
  # (sigma = MAE*sqrt(pi/2) = 7.407pp; P(|e|>6|0) = 2*(1-Phi(6/7.407))), so:
  #   BREACH-BORDERLINE (6 < |norm| <= 11.91) -> ::warning + re-roll x1
  #     (cumulative false-gate 17.5%; re-roll x2 -> 7.3%);
  #   BREACH-ESCALATE (|norm| > 11.91)        -> ::error + MAIN arbitration.
  # Both annotations carry the bench run URL. Exit codes: 0 PASS/skip,
  # 1 gate breach, 2 parse-fail. Censures (never gate, always exit 0):
  # BAND-DEAD (cpu outside [6.0,9.5]M — free discard), HOST-CENS (STW>23s or
  # young_avg>200ms), SKIP-ARMED (lever_flag token — non-vanilla A/B leg),
  # BENCH-CANCELLED (master-ref concurrency cancel, S45 — canary = alias-канал).
  # PER-RUN VERDICT (C51/S45): fires on ANY bench conclusion, stamps every
  # verdict with bench_run_id/head_branch/head_sha and uploads it as
  # canary-gate-verdict-<bench_run_id> — one addressable verdict per bench run,
  # no newest-wins aggregate.
  canary-guard:
    name: canary gate [-6,+6] (norm_v5 vs bank v5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # S100/ROUND-473 (S31-audit fix, option 1): fire on ANY completed bench.
    # success-only filter made BAND-DEAD/SKIP-ARMED/HOST-CENS censor classes
    # unreachable runtime code (S31: 0 guard runs saw failure benches;
    # 5/13 spec rules dead; band-dead canaries left without guard annotation).
    if: github.event_name == 'workflow_run'
    steps:
      - uses: actions/checkout@v4

      - name: fetch bench summary of triggering world-bench-round run
        id: fetch_bench
        # S100: failure benches (band-dead fast-fail @ step-3 calibration gate)
        # upload no world3-bench artifact — fetch outcome is recorded and the
        # classifier below routes to BAND-DEAD via jobs API instead of dying.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: world3-bench
          path: canary-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: parse norm_v5 + gate [-6,+6] (fail on breach, annotate run URL)
        env:
          BENCH_RUN_URL: ${{ github.event.workflow_run.html_url }}
          BENCH_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BENCH_RUN_ID: ${{ github.event.workflow_run.id }}
          # C51 per-run attribution (S45 fix / S86-473 field canon): readers key
          # on bench_run_id inside the verdict JSON — never on artifact freshness.
          BENCH_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          BENCH_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, os, re, statistics
          D = "canary-input"
          URL = os.environ.get("BENCH_RUN_URL", "(run URL unavailable)")
          # bank v5 FREEZE sec.2: cpu_index -> expected TPS (piecewise-linear)
          BANK = [(6.5e6, 2.1252), (7.0e6, 2.2047), (7.5e6, 2.3271),
                  (8.2e6, 2.4732), (8.7e6, 2.5981), (9.0e6, 2.6280)]
          L201 = (6.9e6, 7.2e6, 2.1293)   # L201 local node (L213 gate law)
          BAND = (6.0e6, 9.5e6)           # runner_cpu_index band (canon)
          GATE = 6.0                      # gate window [-6,+6] pp
          MAE = 5.91                      # bank v5 FREEZE sec.4 (191 pts, RMSE 7.44)
          SIG = MAE * math.sqrt(math.pi / 2.0)  # 7.407 pp
          ESCAL = GATE + MAE              # |norm| > 11.91 -> ESCALATE
          verd = {"gate": [-GATE, GATE], "mae": MAE, "sigma": round(SIG, 4),
                  "escalate": ESCAL, "run_url": URL}
          # C51 (S45 per-run-verdict fix / S86-473 field canon): every verdict
          # names the bench run it belongs to. S45 lesson: one constant-named
          # artifact per batch let the newest completed bench hijack the
          # cross-check (s44-a attributed over s45-canary). Attribution is now
          # in-band: bench_run_id / bench_head_branch (alias-канан: head_branch
          # = атрибуция 1:1, Л244) / bench_head_sha / guard ci_run_id.
          RID = os.environ.get("BENCH_RUN_ID", "")
          verd["bench_run_id"] = int(RID) if RID.isdigit() else RID
          verd["bench_head_branch"] = os.environ.get("BENCH_HEAD_BRANCH", "")
          verd["bench_head_sha"] = os.environ.get("BENCH_HEAD_SHA", "")
          verd["ci_run_id"] = int(os.environ.get("GITHUB_RUN_ID", "0") or 0)
          def dump():
              json.dump(verd, open("canary-gate-verdict.json", "w"), indent=1)
          # C85 (ROUND-482 gatefix): the [-6,+6] gate owns ONLY the
          # vanilla-canary input — the master-health canary dispatched on a
          # round-*-canary* branch (legacy canary-N form included). Every
          # other world-bench-round completion (burst feeds, research probes,
          # anchor waves, armed A/B legs) is judged by the STRICT-pairing /
          # min-of-3 canon, NOT by this gate. Letting them through was the
          # RED storm x55 since 08:54Z (C85: gate RED on burst/f6-leg runs).
          # The branch filter is authoritative because run-env.txt carries NO
          # lever marker — SKIP-ARMED below was dead code (run_world3.sh never
          # wrote lever_flag into run-env.txt; gatefix also restores that line
          # as a 2nd layer).
          HB = os.environ.get("BENCH_HEAD_BRANCH", "")
          if not re.match(r'^(?:canary-\d+|round-\d+.*canary)', HB):
              print(f"::notice::canary-gate SKIP-NON-CANARY head_branch='{HB}' — gate owns only round-*-canary* inputs, C85 gatefix (run: {URL})")
              verd["verdict"] = "SKIP-NON-CANARY"; dump(); raise SystemExit(0)
          # S100 (S31-audit fix): failure benches fast-fail at bench step-3
          # ("Runner calibration band gate", S7-96d pairing law) BEFORE any
          # artifact upload -> run-env.txt absent. Classify via jobs API
          # (actions: read): failed band-gate step => BAND-DEAD censor (exit-0
          # canon, free discard); cancelled bench => BENCH-CANCELLED notice
          # (exit-0, concurrency class, S45 precedent); anything else without
          # artifact => PARSE-FAIL exit-2 (loud — never silently censored).
          # Success benches with artifact: this branch is not taken, parse
          # below is bit-identical to the success-only predecessor.
          if not os.path.exists(D + "/run-env.txt"):
              concl = os.environ.get("BENCH_CONCLUSION", "")
              if concl == "cancelled":
                  print(f"::notice::canary-gate BENCH-CANCELLED (per-ref concurrency / manual cancel) — gate not applicable (run: {URL})")
                  verd["verdict"] = "BENCH-CANCELLED"; dump(); raise SystemExit(0)
              if concl == "failure":
                  import urllib.request
                  api = ("https://api.github.com/repos/" + os.environ.get("GITHUB_REPOSITORY", "")
                         + "/actions/runs/" + os.environ.get("BENCH_RUN_ID", "") + "/jobs?per_page=100")
                  band_step = None
                  try:
                      req = urllib.request.Request(api, headers={
                          "Authorization": "Bearer " + os.environ.get("GH_TOKEN", ""),
                          "Accept": "application/vnd.github+json"})
                      jobs = json.load(urllib.request.urlopen(req, timeout=30)).get("jobs", [])
                      for j in jobs:
                          for st in j.get("steps", []):
                              if st.get("conclusion") == "failure" and "band gate" in (st.get("name") or "").lower():
                                  band_step = st.get("name"); break
                          if band_step: break
                  except Exception as e:
                      print(f"::error::canary-gate PARSE-FAIL: artifact missing and jobs API probe error: {e} (run: {URL})")
                      verd["verdict"] = "PARSE-FAIL"; dump(); raise SystemExit(2)
                  if band_step:
                      print(f"::notice::canary-gate BAND-DEAD via bench step-3 '{band_step}' (no artifact by design — fast-fail before upload) — free discard canon, gate not applied (run: {URL})")
                      verd["verdict"] = "BAND-DEAD"
                      verd["classified_via"] = "bench-step3-jobs-api"
                      verd["failed_step"] = band_step
                      dump(); raise SystemExit(0)
              print(f"::error::canary-gate PARSE-FAIL: world3-bench artifact missing (conclusion={concl}) (run: {URL})")
              verd["verdict"] = "PARSE-FAIL"; dump(); raise SystemExit(2)
          txt = ""
          if os.path.exists(D + "/run-env.txt"):
              txt = open(D + "/run-env.txt", encoding="utf-8", errors="replace").read()
          kv = {}
          for ln in txt.splitlines():
              m = re.match(r'^([a-z_0-9]+):\s*(.*?)(?:\s*\(|\s*$)', ln.strip())
              if m and m.group(1) not in kv:
                  kv[m.group(1)] = m.group(2).strip()
          # SKIP-ARMED: armed legs write a label line "<tag>: ... lever_flag=<tok>
          # lever_arg=<tok>"; vanilla run-env has NO such token (absence = vanilla
          # default). Token-boundary regex + '<empty>' filter (naive regex eats
          # lever_arg=<empty> as the value — S40 lesson).
          armed = None
          for m in re.finditer(r'\blever_flag=([^\s()]+)', txt):
              if m.group(1) != "<empty>":
                  armed = m.group(1)
                  break
          if armed:
              print(f"::notice::canary-gate SKIP-ARMED lever_flag={armed} — non-vanilla A/B leg, gate not applicable (run: {URL})")
              verd.update(verdict="SKIP-ARMED", lever_flag=armed); dump(); raise SystemExit(0)
          c = re.match(r'^(\d+)', kv.get("runner_cpu_index", ""))
          if not c:
              print("::error::canary-gate PARSE-FAIL: runner_cpu_index missing from run-env.txt")
              verd["verdict"] = "PARSE-FAIL"; dump(); raise SystemExit(2)
          cpu = int(c.group(1)); verd["cpu"] = cpu
          if not (BAND[0] <= cpu <= BAND[1]):
              print(f"::notice::canary-gate BAND-DEAD runner_cpu_index={cpu} outside [{BAND[0]:.0f},{BAND[1]:.0f}] — free discard (canon), gate not applied (run: {URL})")
              verd["verdict"] = "BAND-DEAD"; dump(); raise SystemExit(0)
          if L201[0] <= cpu <= L201[1]:
              tps_exp, tag = L201[2], "node-L201"
          elif cpu < BANK[0][0]:
              s = (BANK[1][1] - BANK[0][1]) / (BANK[1][0] - BANK[0][0])
              tps_exp, tag = BANK[0][1] + s * (cpu - BANK[0][0]), "extrap-low"
          elif cpu > BANK[-1][0]:
              s = (BANK[-1][1] - BANK[-2][1]) / (BANK[-1][0] - BANK[-2][0])
              tps_exp, tag = BANK[-1][1] + s * (cpu - BANK[-1][0]), "extrap-high"
          else:
              tps_exp, tag = None, None
              for (c0, t0), (c1, t1) in zip(BANK, BANK[1:]):
                  if c0 <= cpu <= c1:
                      tps_exp, tag = t0 + (t1 - t0) * (cpu - c0) / (c1 - c0), "interp"
                      break
          polls = []
          if os.path.exists(D + "/server-stdout.log"):
              for ln in open(D + "/server-stdout.log", encoding="utf-8", errors="replace"):
                  m = re.search(r'TPS from last 5s, 1m, 5m, 15m:\s*([\d.]+)', ln)
                  if m: polls.append(float(m.group(1)))
          tail = [p for p in polls if p < 15.0]
          if not tail:
              print(f"::error::canary-gate PARSE-FAIL: no sub-15 TPS polls (polls_seen={len(polls)}) (run: {URL})")
              verd.update(verdict="PARSE-FAIL", polls_seen=len(polls)); dump(); raise SystemExit(2)
          med = statistics.median(tail)
          norm = 100.0 * (med / tps_exp - 1.0)
          z = norm / SIG
          verd.update(median=med, tps_exp=round(tps_exp, 4), exp_tag=tag,
                      tps_tail=tail, norm=round(norm, 2), z=round(z, 3))
          cens = None
          if os.path.exists(D + "/gc.log"):
              y, ys, tot = 0, 0.0, 0.0
              for ln in open(D + "/gc.log", encoding="utf-8", errors="replace"):
                  if "[gc,start" in ln: continue
                  m = re.search(r'Pause (Young|Full).*?(\d+\.\d+)ms\s*$', ln)
                  if m:
                      ms = float(m.group(2)); tot += ms / 1000.0
                      if m.group(1) == "Young": y += 1; ys += ms
              ya = (ys / y) if y else 0.0
              verd.update(young_n=y, young_avg_ms=round(ya, 1), stw_total_s=round(tot, 2))
              if tot > 23.0 or ya > 200.0:
                  cens = f"HOST-CENS stw={tot:.2f}s young_avg={ya:.1f}ms"
          zone = "PASS" if abs(norm) <= GATE else ("BREACH-BORDERLINE" if abs(norm) <= ESCAL else "BREACH-ESCALATE")
          verd["verdict"] = (cens + "+" + zone) if cens else zone
          dump()
          print(f"canary-gate: cpu={cpu} median={med} tps_exp={tps_exp:.4f} ({tag}) norm={norm:+.2f}pp z={z:+.3f} zone={zone} censure={cens}")
          if cens:
              print(f"::warning::canary-gate {cens} — censure, not a gate (exit-0 canon)")
          if zone == "PASS":
              print(f"::notice::canary-gate PASS norm={norm:+.2f}pp in [-6,+6] — bench-run: {URL}")
              raise SystemExit(0)
          lvl = "warning" if zone == "BREACH-BORDERLINE" else "error"
          print(f"::{lvl}::canary-gate {zone} norm={norm:+.2f}pp z={z:+.3f} breaches [-6,+6] (borderline=re-roll x1; escalate=MAIN arbitration) — bench-run: {URL}")
          raise SystemExit(1)
          PY

      - name: upload canary gate verdict (per-run name — C51/S45 fix)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per-run artifact identity: `canary-gate-verdict-<bench_run_id>`.
          # A constant name made repo-wide listing an aggregate (newest-wins —
          # S45: one verdict per batch, s44-a hijacked s45-canary cross-check);
          # with the bench run id in the name every bench run owns exactly one
          # addressable verdict artifact (per-run canon, no freshness race).
          name: canary-gate-verdict-${{ github.event.workflow_run.id }}
          path: canary-gate-verdict.json
          if-no-files-found: ignore
          retention-days: 30

  # MERGE-SHADOW-GATE (ROUND-473-S27; spec S75 f437b9fb — 16-cell shadow matrix;
  # this job implements the C-context (CI post-run) cells of all 4 gates).
  #
  # After EVERY completed world-bench-round run (ANY conclusion — success and
  # failure alike: a failed run carries the richest NCDFE evidence, S75 §5.2;
  # canary-guard above stays success-only), re-verify the 4 merge-safety gates
  # in FAIL-OPEN shadow mode and append a 4-cell ledger to the
  # merge-shadow-verdict artifact:
  #   SH-BLOB       — independent re-run of scripts/check_blobs_sync.sh on the
  #                   CHECKED-OUT DEFAULT-BRANCH HEAD (catches the "pushed !=
  #                   gated" class; workflow_run checkout = default branch).
  #                   DRIFT-class only: expected 351 marker-OK / 0 FAIL (S25
  #                   326/0 -> S50 351/0 canon); rc != 0, any FAIL line or
  #                   |delta| >= 1 -> notice. Runner javap too old for
  #                   major-65 blobs -> existence-only sweep fallback.
  #   SH-JAVAP      — pin manifest from the bench artifact vs the checkout
  #                   (lite form; the full 337-contract sweep stays
  #                   LOCAL/MAIN/nightly, S75 §5.5). No manifest in the
  #                   artifact -> SKIP (valid outcome).
  #   SH-NCDFE      — runtime parser: NCDFE / AIOOBE / selfTest counters from
  #                   server-stdout.log. Runtime NCDFE>0 (or selfTest=false)
  #                   under a canonical GREEN = FALSE_GREEN — the only
  #                   false-green detector in the chain (S75 §2); AIOOBE>0 =
  #                   DRIFT of the AIOOBE=0 canon (failed-run crash evidence).
  #   SH-PARITY-TAG — re-derive parity from artifact JSONs and compare vs the
  #                   tagged merge certificate (docs/merge_parity_tags.json if
  #                   present in the default branch). No pair data -> SKIP
  #                   (valid outcome, S75 §7.3).
  #
  # Fail-open by construction: exit ALWAYS 0 (Л182 "CI never reverts" holds per
  # build); every divergence surfaces as a ::notice annotation with the bench
  # run URL and is recorded in merge-shadow-verdict.json (retention 30d,
  # if: always). Ledger schema (S75 §3): {ts, run_id, head_sha, gate,
  # canonical_verdict, shadow_verdict, mismatch ∈ {NONE, DRIFT, FALSE_GREEN,
  # FALSE_RED}, details[]}. Promotion of any cell to fail-closed is MAIN's
  # explicit act after the S75 §6 budget (>=30 clean shadow runs + >=1
  # true-positive + lineunion PASS). This job NEVER gates, dispatches, or
  # writes bench inputs (S24 §5 proof carries over verbatim): it only READS the
  # completed run's artifact and the checked-out default branch.
  merge-shadow-gate:
    name: merge shadow gate (fail-open 4-cell ledger, exit always 0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Any-conclusion shadow: fires on success AND failure bench runs (S75 §5.1);
    # on push/PR events github.event.workflow_run is null -> job is skipped,
    # so workflow_run events remain owned by canary-guard + this shadow only.
    if: always() && github.event.workflow_run
    steps:
      - uses: actions/checkout@v4

      - name: fetch bench artifacts of the triggering run (any conclusion)
        id: fetch
        # Fail-open: a missing/inaccessible artifact must not kill the shadow —
        # the python below degrades the artifact-reading cells to SKIP instead.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: world3-bench
          path: shadow-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: run 4-cell shadow ledger (fail-open, exit always 0)
        env:
          BENCH_RUN_URL: ${{ github.event.workflow_run.html_url }}
          BENCH_RUN_ID: ${{ github.event.workflow_run.id }}
          BENCH_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SHADOW_HEAD_SHA: ${{ github.sha }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import datetime, glob, json, os, re, shutil, subprocess

          D = "shadow-input"              # downloaded world3-bench artifact
          URL = os.environ.get("BENCH_RUN_URL", "(run URL unavailable)")
          RID = os.environ.get("BENCH_RUN_ID", "0")
          CONCL = os.environ.get("BENCH_CONCLUSION", "unknown")
          HEAD = os.environ.get("SHADOW_HEAD_SHA", "(unknown)")
          FETCH = os.environ.get("FETCH_OUTCOME", "unknown")
          TS = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          EXPECTED_BLOB_OK = 351          # blobgate canon: S25 326/0 -> S50 351/0
          GATES = ("SH-BLOB", "SH-JAVAP", "SH-NCDFE", "SH-PARITY-TAG")
          CANON = {
              "SH-BLOB": f"FC pre-push gate (canon P2); invariant {EXPECTED_BLOB_OK} OK/0 FAIL",
              "SH-JAVAP": "FC bridges+selftest (canon P4); full 337-contract sweep = LOCAL/D-nightly (S75 sec.5.5)",
              "SH-NCDFE": "FC ncdfe_guard exit-0 pre-merge; runtime canon NCDFE=0 / AIOOBE=0 / selfTest=true",
              "SH-PARITY-TAG": "FC P6 gate2 on candidate + merge parity cert (No11 8/8, S65) — re-derive vs tag",
          }

          LEDGER = []
          def notice(msg):
              print(f"::notice::merge-shadow-gate {msg}")

          def cell(gate, verdict, mismatch, details):
              LEDGER.append({"ts": TS, "run_id": RID, "head_sha": HEAD, "gate": gate,
                              "canonical_verdict": CANON[gate], "shadow_verdict": verdict,
                              "mismatch": mismatch, "details": [str(d) for d in details]})
              tag = "OK" if mismatch == "NONE" else f"SHADOW-{mismatch}"
              notice(f"{tag} {gate}: {verdict} — bench-run: {URL}")

          def armed_note(armed):
              return f"lever armed={armed} (A/B leg — telemetry only)" if armed else "vanilla (no lever_flag token)"

          # --- SH-BLOB: independent re-run on the pushed HEAD (checked-out
          # default branch). Artifact-independent — runs even if fetch failed.
          def sh_blob():
              javap = shutil.which("javap")
              script = "scripts/check_blobs_sync.sh"
              if javap and os.path.exists(script):
                  env = dict(os.environ)
                  j21 = os.environ.get("JAVA_HOME_21_X64") or os.environ.get("JAVA_HOME_21")
                  if j21 and os.path.exists(os.path.join(j21, "bin", "javap")):
                      env["PATH"] = os.path.join(j21, "bin") + os.pathsep + env.get("PATH", "")
                  try:
                      p = subprocess.run(["bash", script], capture_output=True, text=True,
                                          timeout=300, env=env)
                  except subprocess.TimeoutExpired:
                      cell("SH-BLOB", "SKIP", "NONE", ["timeout 300s on full re-run"])
                      return
                  out = (p.stdout or "") + "\n" + (p.stderr or "")
                  ok = len(re.findall(r"(?m)^\s*\S+: OK\b", out))
                  fails = len(re.findall(r"(?m)^\s*(?:\S+: )?FAIL\b", out))
                  stale = re.search(r"unsupported class file version|class file version [0-9.]+ (?:is )?not supported|bad major", out, re.I)
                  if stale and p.returncode != 0:
                      cell("SH-BLOB", "SKIP", "NONE",
                           ["runner javap cannot read major-65 blobs (toolchain gap, not drift)",
                            "existence-only sweep would need python fallback — see below"])
                      return
                  if p.returncode == 0 and fails == 0 and abs(ok - EXPECTED_BLOB_OK) < 1:
                      cell("SH-BLOB", f"OK {ok}/0 (full re-run on pushed HEAD)", "NONE",
                           [f"javap={javap}", "independent default-branch re-run — 'pushed != gated' class"])
                  else:
                      cell("SH-BLOB", f"DRIFT ok={ok} fails={fails} rc={p.returncode} (expected {EXPECTED_BLOB_OK}/0)",
                           "DRIFT", [f"javap={javap}"])
              elif os.path.exists(script):
                  miss, total = [], 0
                  src = open(script, encoding="utf-8", errors="replace").read()
                  for m in re.finditer(r'"([\w/]+\.class)"', src):
                      total += 1
                      if not os.path.exists(m.group(1)):
                          miss.append(m.group(1))
                  if not total:
                      cell("SH-BLOB", "SKIP", "NONE", ["no class args parsed from gate script"])
                  elif not miss:
                      cell("SH-BLOB", f"OK-existence {total}/{total}", "NONE",
                           ["existence-only sweep (no javap on runner)"])
                  else:
                      cell("SH-BLOB", f"DRIFT missing={len(miss)}/{total}", "DRIFT",
                           miss[:5] + ["existence-only sweep (no javap on runner)"])
              else:
                  cell("SH-BLOB", "SKIP", "NONE", ["no gate script and no javap on runner"])

          # --- SH-JAVAP-lite: pin manifest carried by the artifact vs checkout.
          def sh_javap(armed):
              man = sorted(glob.glob(D + "/**/*javap*", recursive=True))
              if not man:
                  cell("SH-JAVAP", "SKIP", "NONE",
                       ["no pin/javap manifest in world3-bench artifact (current canon — record-only cell)",
                        armed_note(armed)])
                  return
              rows = 0
              for fp in man[:10]:
                  try:
                      with open(fp, encoding="utf-8", errors="replace") as fh:
                          rows += sum(1 for ln in fh if ln.strip())
                  except Exception:
                      pass
              cell("SH-JAVAP", f"OK record-only {len(man)} manifest file(s), {rows} rows", "NONE",
                   ["in-tree s36_contracts.tsv absent — full cross-check stays LOCAL/nightly (S75 sec.5.5)",
                    armed_note(armed)])

          # --- SH-NCDFE: runtime parser (the false-green detector).
          def sh_ncdfe(armed):
              log = os.path.join(D, "server-stdout.log")
              if not os.path.exists(log):
                  # R3 (ROUND-474-C53): a missing log used to degrade to a
                  # silent SKIP/NONE cell — the only false-green detector in
                  # the chain went blind exactly on a log-read error, i.e. it
                  # could miss runtime NCDFE>0. The ledger stays fail-open
                  # (exit ALWAYS 0, S75/Л182 — promotion to fail-closed is
                  # MAIN's act), but the cell is now LOUD: DELIVERY-FAIL /
                  # FALSE_RED — the NCDFE evidence chain is broken, the
                  # canonical GREEN is unverifiable for this run.
                  cell("SH-NCDFE",
                       "DELIVERY-FAIL server-stdout.log unreadable (ncdfe evidence chain broken — false-green detector blind on log-read error, R3 C53)",
                       "FALSE_RED",
                       [f"artifact fetch outcome={FETCH}", f"bench conclusion={CONCL}",
                        armed_note(armed)])
                  return
              txt = open(log, encoding="utf-8", errors="replace").read()
              ncdfe = len(re.findall(r"NoClassDefFoundError", txt))
              aioobe = len(re.findall(r"ArrayIndexOutOfBoundsException", txt))
              st_true = len(re.findall(r"(?i)selftest\w*=true", txt))
              st_false = len(re.findall(r"(?i)selftest\w*=false", txt))
              details = [f"ncdfe={ncdfe} aioobe={aioobe} selfTest_true={st_true} selfTest_false={st_false}",
                          f"bench conclusion={CONCL}", armed_note(armed)]
              if st_false:
                  cell("SH-NCDFE", "FALSE_GREEN selfTest=false (canon selfTest=true)", "FALSE_GREEN", details)
              elif ncdfe:
                  cell("SH-NCDFE", f"FALSE_GREEN runtime NCDFE={ncdfe} (canon T1=0 — static GREEN did not predict runtime)",
                       "FALSE_GREEN", details)
              elif aioobe:
                  note = (" — failed-run crash evidence (richest NCDFE-class witness, S75 sec.5.2)"
                          if CONCL != "success" else "")
                  cell("SH-NCDFE", f"DRIFT AIOOBE={aioobe} (canon AIOOBE=0)" + note, "DRIFT", details)
              else:
                  verd = "OK runtime NCDFE=0/AIOOBE=0 correlates with canonical GREEN"
                  if st_true == 0:
                      verd += "; selfTest marker absent — not verifiable here (FP-poison guard S75 sec.7.4)"
                  cell("SH-NCDFE", verd, "NONE", details)

          # --- SH-PARITY-TAG: re-derive parity from artifact JSONs vs tag.
          def sh_parity(armed):
              acc = []
              def walk(o):
                  if isinstance(o, dict):
                      for k, v in o.items():
                          if re.search(r"parity|PAIR_VAN|PAIR_LEG", str(k), re.I):
                              acc.append((str(k), v))
                          walk(v)
                  elif isinstance(o, list):
                      for v in o[:20]:
                          walk(v)
              for fp in glob.glob(D + "/**/*.json", recursive=True)[:50]:
                  try:
                      walk(json.load(open(fp, encoding="utf-8")))
                  except Exception:
                      pass
              if not acc:
                  cell("SH-PARITY-TAG", "SKIP", "NONE",
                       ["no parity/pair data in artifact JSONs — valid outcome (S75 sec.7.3)",
                        armed_note(armed)])
                  return
              ratio_ok = True
              for k, v in acc:
                  m = isinstance(v, str) and re.match(r"^\s*(\d+)\s*/\s*(\d+)\s*$", v)
                  if m:
                      ratio_ok &= (m.group(1) == m.group(2))
                  elif isinstance(v, bool):
                      ratio_ok &= v
                  elif isinstance(v, (int, float)) and k.lower().endswith(("fail", "fails", "mismatch")):
                      ratio_ok &= (v == 0)
              derived = "PASS" if ratio_ok else "FAIL"
              tag_file = "docs/merge_parity_tags.json"
              if os.path.exists(tag_file):
                  try:
                      tags = json.load(open(tag_file, encoding="utf-8"))
                      entry = tags.get(str(RID)) or tags.get("latest")
                      tagv = str(entry.get("parity", entry)).upper() if isinstance(entry, dict) else str(entry).upper()
                  except Exception:
                      tagv = None
                  if tagv is None:
                      cell("SH-PARITY-TAG", f"derived={derived}; tag file unreadable — record-only", "NONE", acc[:5])
                  elif derived == "FAIL" and tagv == "PASS":
                      cell("SH-PARITY-TAG", "FALSE_GREEN re-derive FAIL vs tagged cert PASS (cert not reproducible)",
                           "FALSE_GREEN", acc[:5])
                  elif derived == "PASS" and tagv == "FAIL":
                      cell("SH-PARITY-TAG", "FALSE_RED re-derive PASS vs tagged cert FAIL", "FALSE_RED", acc[:5])
                  else:
                      cell("SH-PARITY-TAG", f"OK re-derive {derived} == tag {tagv}", "NONE", acc[:5])
              else:
                  cell("SH-PARITY-TAG", f"derived={derived} (record-only — no docs/merge_parity_tags.json in default branch)",
                       "NONE", acc[:5] + [armed_note(armed)])

          def main():
              have_art = os.path.isdir(D) and bool(os.listdir(D))
              armed = None
              if have_art and os.path.exists(D + "/run-env.txt"):
                  txt = open(D + "/run-env.txt", encoding="utf-8", errors="replace").read()
                  for m in re.finditer(r"\blever_flag=([^\s()]+)", txt):
                      if m.group(1) != "<empty>":
                          armed = m.group(1)
                          break
              sh_blob()
              if have_art:
                  sh_javap(armed)
                  sh_ncdfe(armed)
                  sh_parity(armed)
              else:
                  for g in ("SH-JAVAP", "SH-NCDFE", "SH-PARITY-TAG"):
                      cell(g, "SKIP", "NONE",
                           [f"artifact fetch outcome={FETCH}, dir present={have_art} — no bench artifacts to parse"])

          try:
              main()
          except Exception as e:
              LEDGER.append({"ts": TS, "run_id": RID, "head_sha": HEAD, "gate": "JOB",
                              "canonical_verdict": "(n/a)", "shadow_verdict": f"EXCEPTION {type(e).__name__}",
                              "mismatch": "NONE", "details": [str(e)]})
              notice(f"ledger exception {type(e).__name__}: {e} — partial cells recorded, fail-open exit 0")
          summary = {
              "cells": len(LEDGER),
              "skipped": sum(1 for c in LEDGER if c["shadow_verdict"].startswith("SKIP")),
              "drifts": sum(1 for c in LEDGER if c["mismatch"] == "DRIFT"),
              "false_greens": sum(1 for c in LEDGER if c["mismatch"] == "FALSE_GREEN"),
              "false_reds": sum(1 for c in LEDGER if c["mismatch"] == "FALSE_RED"),
          }
          doc = {"schema": "merge-shadow-gate/v1",
                  "spec": "S75 f437b9fb (16-cell matrix; job implements the 4 C-context cells)",
                  "ts": TS, "run_id": RID, "head_sha": HEAD, "bench_run_url": URL,
                  "bench_conclusion": CONCL, "artifact_fetch_outcome": FETCH,
                  "cells": LEDGER, "summary": summary}
          try:
              json.dump(doc, open("merge-shadow-verdict.json", "w"), indent=1)
              notice(f"summary: cells={summary['cells']} skipped={summary['skipped']} drifts={summary['drifts']} false_greens={summary['false_greens']} false_reds={summary['false_reds']} — ledger artifact merge-shadow-verdict.json (fail-open, exit 0) — bench-run: {URL}")
          except Exception as e:
              notice(f"verdict dump failed {type(e).__name__}: {e} — fail-open exit 0")
          raise SystemExit(0)
          PY

      - name: upload merge shadow verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-shadow-verdict
          path: merge-shadow-verdict.json
          if-no-files-found: ignore
          retention-days: 30
