# c-crussty CI — Rust module + recovered native workspace + NCF Phase 0.
#
# Three surfaces are exercised:
#   - module / native / fuzz-crate: the pre-NCF Rust surface (cargo only).
#   - chunk-factory: the NCF standalone crate (deliberately workspace-excluded,
#     sealed .so boundary) — build + unit tests on its own.
#   - golden-harness: the NCF Phase 0 gate on a REAL Purpur 1.21.10 server
#     (owner directive 2026-10-05: "test on GH CI" — the sandbox rig dies on
#     reset, so the Phase 0 order-test control must be replayable on a fresh
#     runner). bench/golden/ci_gate.sh:
#       * builds GoldenDumper.jar from source (guards the mojang-mapped
#         compile surface against drift);
#       * boots TWO FRESH pure-vanilla servers on the canon seed 3053459,
#         dumps the 16x16 region in the canonical spiral order and requires
#         ncfdiff equality on all 256 pairs (replays the control row of
#         bench/golden/results/ORDER_TEST_2026-10-05.md);
#       * then one FRESH spiral boot per GATE_SEEDS seed = P0.4 vanilla
#         corpora, uploaded as artifacts.
#     Purity law holds by construction: dump_corpus.sh is the only boot path —
#     plain Purpur (build pinned via PURPUR_BUILD), NO CRUSSTY agent, no JVM
#     flags beyond heap.

name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check
      # Single-threaded on purpose: unit tests exercise the global SVER
      # seqlock plane (low-level writer helpers bump the GLOBAL shard
      # counters even for local Soa fixtures — production callers hold the
      # WLOCK, tests call them directly), so parallel test threads can tear
      # the sharded reader's brackets -> bounded fail-open ERR_RANGE on
      # loaded 2-vCPU runners.
      - run: cargo test -- --test-threads=1

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: native workspace (recovered P500 sources)
        run: |
          cargo check --workspace
          cargo test --workspace
        working-directory: native

  fuzz-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check
        working-directory: area-map-fuzz

  chunk-factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chunk-factory
      - name: chunk-factory crate (NCF Phase 0 gate/coverage/ledger)
        working-directory: chunk-factory
        run: |
          cargo build
          cargo test
      # C3/T7: no FMA contraction anywhere in the factory. The crate never
      # writes mul_add and this build pins -C target-cpu to the baseline, so
      # ANY vfmadd/vfmsub/vfnmadd in the disassembly is a regression.
      - name: C3/T7 FMA-free check (release disassembly)
        working-directory: chunk-factory
        run: |
          cargo build --release
          if objdump -d target/release/bench target/release/stagediff 2>/dev/null | grep -E "vfmadd|vfmsub|vfnmadd|fnmadd|fnmsub"; then
            echo "FMA instruction found in release build — I2/T7 violated"
            exit 1
          else
            echo "no FMA instructions — OK"
          fi
      # P0.7 / ГЕЙТ P2 line 2 honest measurement (single-core, no NBT write)
      - name: noise-stage bench (honest P2 gate numbers)
        working-directory: chunk-factory
        run: |
          python3 - <<'PY'
          import zipfile, os
          import subprocess
          # extract the vanilla worldgen tree from CI's provisioned jar if present
          jar = os.path.join('..', 'ci-server', 'versions', '1.21.10', 'purpur-1.21.10.jar')
          if not os.path.exists(jar):
              subprocess.run(['curl', '-fsSL', '--retry', '3', '-o', '/tmp/purpur.jar',
                              'https://api.purpurmc.org/v2/purpur/1.21.10/2535/download'], check=True)
              jar = '/tmp/purpur.jar'
          root = '/tmp/wg-extract'
          z = zipfile.ZipFile(jar)
          for name in z.namelist():
              if name.endswith('.json') and (name.startswith('data/minecraft/worldgen/') or name.startswith('data/minecraft/tags/block/')):
                  dest = os.path.join(root, *name.split('/'))
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  open(dest, 'wb').write(z.read(name))
          print('extracted worldgen for bench')
          PY
          NCF_WG=/tmp/wg-extract ./target/release/bench 3053459 64 noise | tee ../bench/golden/results/bench_noise_$(date -u +%Y-%m-%d).log

  golden-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PURPUR_BUILD: '2535'
      GATE_SEEDS: '90210 424242 8675309 133700'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: ncfdiff selftest (stdlib only, no server)
        run: python3 bench/golden/tools/ncfdiff.py --selftest
      - name: Phase 0 golden gate (2 fresh spiral boots, zero-diff) + P0.4 seed corpora
        run: bash bench/golden/ci_gate.sh
      - name: upload logs + reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-gate-logs
          path: |
            bench/golden/results/
            ci-server/logs/
            ci-server/patchonly.log
          if-no-files-found: warn
          retention-days: 14
      - name: upload golden dump corpora (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-dump-corpora
          path: ci-server/golden/
          if-no-files-found: warn
          retention-days: 30

  # NCF P0.3-tail / P1: golden-vector gate. Captures random/noise/density
  # vectors from the REAL Paper classes (/goldenvec) and requires the Rust
  # ports to match BIT-EXACTLY (veccheck), plus the Phase 1 IR gate over the
  # vanilla datapack (ircheck). 13171 vector rows, zero mismatches allowed.
  ncf-vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PURPUR_BUILD: '2535'
      SEED: '3053459'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chunk-factory
      - name: vectors + IR gate (boot -> goldenvec -> ircheck + veccheck)
        run: bash bench/golden/ci_vectors.sh
      - name: upload vector gate artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-vector-gate
          path: |
            bench/golden/results/veccheck_*.log
            bench/golden/results/ircheck_*.log
            bench/golden/results/golden_vec_boot.log
          if-no-files-found: warn
          retention-days: 30
      - name: upload captured vectors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-vectors
          path: ci-server/golden/ci_vec/vectors/
          if-no-files-found: warn
          retention-days: 30

  # NCF T38-B bisect rig (Job 441690): the canon vector corpus covers
  # POSITIVE coords only (density grid 1600..1840, chunk 100,100); the
  # gate-P2 blobs live at NEGATIVE coords (vanilla 3053459: chunks
  # -18..-10 x -19..-11; first divergence c_-10_-16 @ (-160,79,-251),
  # stone<->air and stone<->water near the substance/aquifer threshold).
  # /goldendensity dumps the FULL vector family (interp + aquifer + density
  # scalar DAG incl. the 6 climate fields) at the blob chunk; veccheck and
  # aquacheck must reproduce every row BIT-EXACTLY. No JVM flags: the
  # capture coords ride as RCON arguments.
  ncf-density:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # addendum 19/21: (1) the canonical vanilla 3053459 blob (T38-B);
        # (2) seed 90210 at the ancient_city stub column (chunk (-18,-14),
        # box-center grid around (-246..-182, -27)) — the decisive Г1/Г2
        # experiment: if java's climate scalars there say deep_dark while
        # --biome-at says jungle, the KERNEL climate lookup diverges at
        # negative coords (Г1); if they match (jungle) and the aquacheck
        # substance rows still flip deep (y -26..-53), the residual 90210
        # divergences are the aquifer locationCache class (Г2).
        include:
          - seed: '3053459'
            bx: '-160'
            bz: '-256'
            band_y0: '40'
            band_y1: '100'
            label: blob3053459
          - seed: '90210'
            bx: '-246'
            bz: '-182'
            band_y0: '-64'
            band_y1: '16'
            label: blob90210
          # addendum 23: the TWO residual vanilla-3053459 divergences after the
          # I8 exclusion (run 37601709929: 1191/1193; c_15_-5 @ (253,-29,-67),
          # c_17_-12 @ (284,-37,-183), java=air rust=stone) — density-class at
          # y<40 outside the shadow (addendum 22; ancient_city refuted: the
          # stub column is forest in our own pipeline). Decisive per-block
          # capture: if veccheck/aquacheck FAIL here, the first diverging
          # field IS the root; if they PASS, the flip lives below the capture
          # granularity (aquifer meta/loc class).
          - seed: '3053459'
            bx: '253'
            bz: '-67'
            band_y0: '16'
            band_y1: '40'
            label: resid1_3053459
          - seed: '3053459'
            bx: '284'
            bz: '-183'
            band_y0: '16'
            band_y1: '40'
            label: resid2_3053459
    env:
      PURPUR_BUILD: '2535'
      SEED: ${{ matrix.seed }}
      BX: ${{ matrix.bx }}
      BZ: ${{ matrix.bz }}
      BAND_Y0: ${{ matrix.band_y0 }}
      BAND_Y1: ${{ matrix.band_y1 }}
      LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chunk-factory
      - name: blob-density vector gate (boot -> goldendensity -> veccheck + aquacheck)
        run: bash bench/golden/ci_density.sh
      - name: upload blob-density gate artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-density-blob-${{ matrix.label }}
          path: |
            bench/golden/results/veccheck_blob_*.log
            bench/golden/results/aquacheck_blob_*.log
            bench/golden/results/golden_density_boot.log
            ci-server/golden/${{ matrix.label }}/vectors/
          if-no-files-found: warn
          retention-days: 30

  # NCF task 5 gate: STAGED chunk content zero-diff. The server dumps 225
  # chunks at the NOISE ChunkStatus (raw noise+aquifer+vein content, pre-
  # surface); the Rust filler (chunk-factory::filler) regenerates the same
  # chunks and stagediff compares block-by-block + biome-by-biome +
  # heightmaps. PASS <=> 225/225 EQUAL (P2.6/P2.7/biome-fill evidence).
  ncf-staged:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # session 6: SURFACE (P2.5 surface rules) and CARVERS (P2.8 carvers)
        # joined the NOISE oracle as staged zero-diff gates
        status: [noise, surface, carvers]
    env:
      PURPUR_BUILD: '2535'
      SEED: '3053459'
      STAGED_STATUS: '${{ matrix.status }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chunk-factory
      - name: staged zero-diff gate (boot -> staged dump -> gen-batch -> stagediff)
        run: bash bench/golden/ci_staged.sh
      - name: upload staged gate artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncf-staged-gate
          path: |
            bench/golden/results/staged_boot.log
            bench/golden/results/staged_gen_*.log
            bench/golden/results/stagediff_*.log
          if-no-files-found: warn
          retention-days: 30

  # NCF P3.1 gate: the server READS a .mca region file written by the RUST
  # region writer. Two boots: (1) pure-vanilla raw dump (uncompressed chunk
  # NBT + deterministic non-random-tick probes), (2) fresh world holding ONLY
  # the Rust-forged region file -> forceload -> /execute if block probes.
  # PASS <=> 18/18 block probes match the real generator's output.
  ncf-mca:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PURPUR_BUILD: '2535'
      SEED: '3053459'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chunk-factory
      - name: forge .mca from raw chunk NBT (Rust) + mount + probe on a live server
        run: bash bench/golden/ci_mca.sh
      - name: upload P3.1 gate artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mca-gate-logs
          path: |
            bench/golden/results/mca_*.log
            bench/golden/results/mca_probe_*.txt
            bench/golden/results/mcaforge_*.log
          if-no-files-found: warn
          retention-days: 30

  # NCF P0.4 tail: worldgen-datapack corpora (Terralith + Tectonic) for the
  # Phase 2 GATE matrix, plus the IR gate over non-vanilla datapack routers.
  ncf-datapacks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PURPUR_BUILD: '2535'
      SEED: '3053459'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chunk-factory
      - name: datapack corpora (terralith + tectonic, spiral, fresh boots)
        run: bash bench/golden/ci_datapacks.sh
      - name: upload datapack corpora (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-datapack-corpora
          path: |
            ci-server/golden/terralith_s*/
            ci-server/golden/tectonic_s*/
            ci-datapacks/*.zip
          if-no-files-found: warn
          retention-days: 30

  # ГЕЙТ P2 line 1: >=10^4 chunks x >=5 seeds x {vanilla, Terralith, Tectonic}
  # zero-diff at the NOISE status. 15 CI cells = 5 seeds x 3 packs, 2401
  # chunks (49x49 spiral) each -> 36015 chunks of bit-exact evidence per run.
  ncf-gate-p2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: ['3053459', '90210', '424242', '8675309', '133700']
        pack: [vanilla, terralith, tectonic]
    env:
      PURPUR_BUILD: '2535'
      SEED: '${{ matrix.seed }}'
      PACK: '${{ matrix.pack }}'
      STATUS: 'noise'
      RADIUS: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: chunk-factory
      - name: gate cell ${{ matrix.pack }} seed ${{ matrix.seed }} (2401 chunks, stagediff)
        run: bash bench/golden/ci_gate_p2.sh
      - name: upload gate-cell artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-gate-${{ matrix.pack }}-${{ matrix.seed }}
          path: |
            bench/golden/results/p2_*.log
          if-no-files-found: warn
          retention-days: 30
