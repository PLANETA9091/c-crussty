# P500 benchmark CI (c-crussty)
#
# P500 is a standalone JNI benchmark: it needs ONLY a JDK (javac/java) and the
# closed-source natives committed in native/. It does NOT need the Rust plugin
# build — the plugin (cargo) pipeline is separate and is intentionally NOT run
# here, to keep this workflow fast and cheap.
#
# Triggers are path-restricted so the bench does not run on every commit:
#   bench/p500/**              — bench driver / report changes
#   native/**                  — .so updates (the thing we want to re-benchmark)
#   bench/lifecycle/**         — lifecycle A/B bench (activates lifecycle-smoke job)
#   .github/workflows/p500.yml — validate workflow edits themselves
name: P500 benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - 'bench/p500/**'
      - 'native/**'
      - 'bench/lifecycle/**'
      - '.github/workflows/p500.yml'

permissions:
  contents: read

concurrency:
  group: p500-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p500-bench:
    name: P500 JNI bench (ubuntu-latest)
    runs-on: ubuntu-latest
    # Guard against stuck runs; run_p500.sh additionally applies a 600s timeout
    # per group (one JVM per group, retry ladder on SIGABRT-kernels).
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-java puts Temurin 21 on PATH and exports JAVA_HOME.
      # run_p500.sh resolves javac via: /home/z/jdk21 (sandbox-only) -> $JAVA_HOME
      # -> PATH, so on the runner it transparently uses the setup-java toolchain.
      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify committed natives
        run: |
          test -s native/libpaper_native_jni.so \
            || { echo "::error::native/libpaper_native_jni.so missing or empty"; exit 1; }
          test -s native/libpaper_native_chunk_encode_jni.so \
            || { echo "::error::native/libpaper_native_chunk_encode_jni.so missing or empty"; exit 1; }
          ls -l native/

      # No Rust toolchain here on purpose: P500 = javac/java + committed .so only.
      # The plugin itself (cargo build) is built/verified by a separate pipeline.
      #
      # continue-on-error: a misbehaving closed-source kernel can still take the
      # whole step down even though run_p500.sh isolates one JVM per group. We
      # want the partial TSV/report uploaded anyway — the gate step below turns
      # a bad run (>3 CRASHed groups) into a hard failure, so the job cannot
      # fail silently.
      - name: Compile + run P500 bench
        continue-on-error: true
        run: bash bench/p500/run_p500.sh

      - name: Add report to job summary
        if: hashFiles('bench/p500/results/P500_REPORT.md') != ''
        run: cat bench/p500/results/P500_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload P500 results
        uses: actions/upload-artifact@v4
        with:
          name: p500-results
          path: |
            bench/p500/results/p500_raw.tsv
            bench/p500/results/P500_REPORT.md
          retention-days: 14
          if-no-files-found: error

      - name: Gate — fail if more than 3 groups CRASHed
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tsv = Path("bench/p500/results/p500_raw.tsv")
          if not tsv.is_file():
              print("::error::bench/p500/results/p500_raw.tsv not found (bench never produced output)")
              raise SystemExit(1)

          crashed = sorted({
              line.split("\t")[1]
              for line in tsv.read_text(encoding="utf-8").splitlines()
              if line.startswith("CRASH\t") and len(line.split("\t")) > 1
          })

          print(f"CRASHed groups: {len(crashed)}" + (f" -> {', '.join(crashed)}" if crashed else ""))
          if len(crashed) > 3:
              print(f"::error::P500 bench: {len(crashed)} groups CRASHed (>3 allowed): {', '.join(crashed)}")
              raise SystemExit(1)
          print("gate OK: <=3 CRASHed groups")
          PY

  # Lifecycle A/B bench (ImprovedNoiseNativeOps finalize-vs-explicit-release).
  # bench/lifecycle/run_lifecycle.sh does not exist yet; the hashFiles guards
  # below activate the bench automatically once the script lands.
  # NOTE: guards are step-level (after checkout) on purpose — job-level
  # hashFiles is evaluated BEFORE checkout, when the workspace is still empty,
  # so it would always return '' and the job would never run.
  lifecycle-smoke:
    name: Lifecycle A/B smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run lifecycle A/B bench
        if: hashFiles('bench/lifecycle/run_lifecycle.sh') != ''
        run: bash bench/lifecycle/run_lifecycle.sh

      - name: Upload lifecycle results
        if: hashFiles('bench/lifecycle/run_lifecycle.sh') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-results
          path: |
            bench/lifecycle/results/**
            bench/lifecycle/*.tsv
            bench/lifecycle/*.md
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # TASK-14 ratio-gate: run a smoke subset of P500 groups (5 JNI-floor
  # parity groups from P500_REPORT_v2.md — the fastest, most
  # hardware-stable part of the suite) and FAIL when any kernel regresses
  # >20% vs bench/p500/baseline.json (medians taken VERBATIM from
  # P500_REPORT_v2.md @3baa0f7).
  #
  # Paired-ratio methodology (P500_REPORT_v2.md): absolute ns/op is noisy
  # on shared runners — RATIOS are the signal. Each measured kernel median
  # is compared to its OWN baseline median; the 1.2x threshold mirrors the
  # v2 aggregator's 20% baseline-drift band (BASELINE_DRIFT = 0.20).
  #
  # Resilience contract: group failures / CRASHes / unknown groups are
  # skip-with-warning (the >3-CRASH gate in p500-bench owns crash counts);
  # only a >1.2x ratio, missing bench output, or a broken baseline.json is
  # a hard failure. The threshold lives in bench/p500/scripts/ratio_gate.py
  # and is deliberately not data-configurable (cannot be quietly weakened).
  ratio-gate:
    name: P500 ratio-gate (smoke subset vs v2 baseline, 1.2x)
    runs-on: ubuntu-latest
    # Smoke subset = 5 groups x (one JVM, ~120ms batches, median-of-5):
    # seconds of bench per group — whole job stays well under 5 min.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify committed natives
        run: |
          test -s native/libpaper_native_jni.so \
            || { echo "::error::native/libpaper_native_jni.so missing or empty"; exit 1; }
          test -s native/libpaper_native_chunk_encode_jni.so \
            || { echo "::error::native/libpaper_native_chunk_encode_jni.so missing or empty"; exit 1; }

      # Single source of truth: baseline.json decides both WHICH groups are
      # gated and WHICH groups run. Resolving class+sig -> gid here (instead
      # of hardcoding ids) catches class/sig drift between baseline.json and
      # groups.tsv BEFORE benching (exit 2 = job fails fast).
      - name: Resolve smoke group ids from baseline.json
        id: resolve
        run: |
          GIDS=$(python3 bench/p500/scripts/ratio_gate.py --resolve-gids \
            --baseline bench/p500/baseline.json \
            --groups-tsv bench/p500/java/p500/groups.tsv)
          echo "smoke groups (gid): $GIDS"
          echo "gids=$GIDS" >> "$GITHUB_OUTPUT"

      # continue-on-error: a dead JVM / runner hiccup must not hard-fail the
      # job here — the gate step below decides. run_p500.sh isolates one JVM
      # per group, applies its own retry ladder, and still writes CRASH rows
      # to p500_raw.tsv so the gate can warn-and-skip per group.
      - name: Run P500 smoke subset (JNI-floor parity groups from baseline.json)
        continue-on-error: true
        run: |
          # Gate must measure THIS run only: results/p500_raw.tsv is committed
          # (last full sandbox run), so remove it first — if the bench dies
          # before run_p500.sh truncates it, the gate must see 'missing TSV'
          # (hard fail), never the stale committed numbers.
          rm -f bench/p500/results/p500_raw.tsv
          bash bench/p500/run_p500.sh ${{ steps.resolve.outputs.gids }}

      # TASK-37: aggregator guardrails (TASK-34 --check/--strict) wired into the
      # smoke flow. Design: (1) --check runs ONLY on the pinned fixture in
      # bench/p500/tests/ — the checked-in results/p500_expected_summary.tsv was
      # derived from the FULL 49-group TSV and would false-fail on a 5-group
      # smoke TSV; (2) --strict runs on the CI-produced smoke TSV — the 5
      # baseline.json groups are exact 1:1 pairs (unpaired g38 is NOT among
      # them), so exit 2 means a half-crashed/missing kernel in a smoke group.
      - name: Aggregator hygiene — pinned fixture --check (TASK-34 derivation gate)
        run: >-
          python3 bench/p500/aggregate_p500.py
          bench/p500/tests/p500_fixture_regression.tsv
          --check bench/p500/tests/p500_fixture_expected.tsv

      - name: Aggregator strict — fresh smoke TSV must be fully paired
        run: |
          test -s bench/p500/results/p500_raw.tsv \
            || { echo "::error::smoke TSV missing — cannot run --strict"; exit 1; }
          python3 bench/p500/aggregate_p500.py bench/p500/results/p500_raw.tsv --strict

      # Hard gate: exit 1 only on a >1.2x regression vs baseline.json (or
      # missing bench output / unreadable baseline). Skips are warnings.
      - name: Gate — fail if any kernel > 1.2x P500_REPORT_v2 baseline
        run: >-
          python3 bench/p500/scripts/ratio_gate.py
          --baseline bench/p500/baseline.json
          --measured bench/p500/results/p500_raw.tsv

      - name: Upload ratio-gate results
        if: always() && hashFiles('bench/p500/results/p500_raw.tsv') != ''
        uses: actions/upload-artifact@v4
        with:
          name: p500-ratio-gate-results
          path: bench/p500/results/p500_raw.tsv
          retention-days: 14
          if-no-files-found: ignore
