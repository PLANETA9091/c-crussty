<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-label="c-crussty — native optimization module for the CRUSSTY platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ce7a58" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ce7a58" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="200" rx="16" fill="url(#bg)"/>
  <rect width="800" height="200" rx="16" fill="url(#grid)"/>
  <rect width="800" height="200" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="799" height="199" rx="15.5" fill="none" stroke="#30363d"/>

  <!-- left accent bar -->
  <rect x="28" y="44" width="5" height="112" rx="2.5" fill="#ce7a58"/>

  <!-- platform tag, top right -->
  <rect x="642" y="30" width="122" height="26" rx="13" fill="none" stroke="#30363d"/>
  <circle cx="661" cy="43" r="4.5" fill="#ce7a58"/>
  <text x="673" y="47.5" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#adbac7" letter-spacing="0.5">Rust</text>

  <!-- title -->
  <text x="52" y="102" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" font-size="50">
    <tspan fill="#ce7a58">c-</tspan><tspan fill="#e6edf3">crussty</tspan>
  </text>

  <!-- subtitle -->
  <text x="52" y="134" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#8b949e">native optimization module for the CRUSSTY platform</text>

  <!-- stat chips -->
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#adbac7">
    <rect x="52" y="154" width="146" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text x="67" y="171">98 bridges</text>

    <rect x="208" y="154" width="190" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text x="223" y="171">283 native exports</text>

    <rect x="408" y="154" width="216" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <text x="423" y="171">129 kernels · 0 crashes</text>
  </g>
</svg>
