[package]
name = "chunk_factory"
version = "0.1.0"
edition = "2021"
description = "Native Chunk Factory: vanilla-identical chunk generation in Rust, chunk = pure function f(seed, datapack, version, x, z) -> NBT (Phase 1: worldgen IR + scalar evaluator; Phase 2: bit-exact random/noise kernels, golden-vector gated; P3.1: .mca region writer)"

# Standalone crate: deliberately EXCLUDED from the root `crussty` workspace
# (see ../Cargo.toml [workspace] exclude). No external dependencies -- std
# only, on purpose: this crate must stay buildable in isolation and must never
# drag the JVMTI agent's dependency tree into the factory (and vice versa:
# the shipped closed .so cannot gain kernels, all new worldgen code lives
# here).
[[bin]]
name = "veccheck"
path = "src/bin/veccheck.rs"

[[bin]]
name = "ircheck"
path = "src/bin/ircheck.rs"

[[bin]]
name = "mcaforge"
path = "src/bin/mcaforge.rs"

[dependencies]

[[bin]]
name = "stagediff"
path = "src/bin/stagediff.rs"

[[bin]]
name = "aquacheck"
path = "src/bin/aquacheck.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

# ncf_profile probe class (NCF_CARVE_*, NCF_AQUIFER_TIME, NCF_S1_PROBE, ...):
# register the cfg name so rustc 1.99+ unexpected_cfgs stays quiet on BOTH
# probe builds (RUSTFLAGS="--cfg ncf_profile") and normal CI builds.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ncf_profile)'] }

